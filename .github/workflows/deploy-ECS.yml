##############################################################################################
#This workflow is triggered on push to the main branch and deploys the application to AWS ECS
# step 1 -> Push to Docker Hub
# step 2 -> Force new deployment (Since only :latest tag is updated everytime)
# #############################################################################################

name : Deploy to ECS
on:
  push:
    branches:
      - master
    paths-ignore:
      - './infra/*'
      - './.github/workflows/deploy-lambda-sqs-infra.yml'
      - './lambda/*'
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo.
        uses: actions/checkou@v4
    
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/invoice-generator:latest

      
