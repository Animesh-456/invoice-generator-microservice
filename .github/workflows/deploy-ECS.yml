##############################################################################################
#This workflow is triggered on push to the main branch and deploys the application to AWS ECS
# step 1 -> Push to Docker Hub
# step 2 -> Force new deployment (Since only :latest tag is updated everytime)
# #############################################################################################

name : Deploy to ECS
on:
  # push:
  #   branches:
  #     - master
  #   paths-ignore:
  #     - './infra/*'
  #     - './.github/workflows/deploy-lambda-sqs-infra.yml'
  #     - './lambda/*'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI
      

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo.
        uses: actions/checkout@v4
    
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/invoice-generator:latest

      - name: Configure AWS Credentials
        # Assumes you have AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new Deployement
        run: |
          echo "Forcing new deployment on ECS..."
          aws ecs update-service \
          --cluster ${{ secrets.INVOICE_GENERATOR_CLUSTER }} \
          --service ${{ secrets.INVOICE_GENERATOR_SERVICE}} \
          --force-new-deployment

      - name: Wait for deployent to complete
        timeout-minutes: 15
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
          --cluster ${{ secrets.INVOICE_GENERATOR_CLUSTER }} \
          --services ${{ secrets.INVOICE_GENERATOR_SERVICE}} \
          --region ${{ secrets.AWS_REGION }}