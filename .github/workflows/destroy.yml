name: Destroy Infrastructure

on:
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI


jobs:
  terraform_destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    environment: Production # Use GitHub Environments for protection/approvals

    env:
      # Match the exact Terraform variable names defined in infra/variables.tf
      TF_VAR_environment: production
      TF_VAR_region: ${{ secrets.AWS_REGION }}
      TF_VAR_invoice_bucket_name: ${{ secrets.INVOICE_BUCKET_NAME }}
      TF_VAR_aws_ecs_cluster_name: ${{ secrets.INVOICE_GENERATOR_CLUSTER }}
      TF_VAR_aws_ecs_service_name: ${{ secrets.INVOICE_GENERATOR_SERVICE }}
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_user: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_ses_from_email: ${{ secrets.SES_FROM_EMAIL }}
      TF_VAR_invoice_url_ttl_seconds: "3600"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        # Assumes you have AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false

      - name: Terraform Destroy
        working-directory: ./infra
        run: terraform destroy -auto-approve