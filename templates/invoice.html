<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
    .header {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }
    .section {
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background: #f4f4f4;
    }
  </style>
</head>
<body>

  <div class="header">INVOICE</div>

  <div class="section">
    <strong>Invoice No:</strong> {{invoiceNumber}}<br />
    <strong>Date:</strong> {{date}}
  </div>

  <div class="section">
    <strong>Customer:</strong> {{customerName}}<br />
    <strong>Email:</strong> {{email}}
  </div>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Payment for order</td>
        <td>₹ {{amount}}</td>
      </tr>
    </tbody>
  </table>

  <div class="section">
    <strong>Total:</strong> ₹ {{amount}}
  </div>

</body>
</html>
